apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: "tilbakekreving-tvangsgrunnlag"
  namespace: "tilbake"
  labels:
    "team": "tilbake"

spec:
  image: {{image}}
  maskinporten:
    enabled: true
    scopes:
      exposes:
        - accessibleForAll: false
          allowedIntegrations:
            - maskinporten
          atMaxAge: 30
          consumers:
            - name: Skatteetaten
              orgno: "974761076"
          delegationSource: altinn
          enabled: true
          name: scope.read
          product: arbeid
          separator: '/'
          visibility: private
  resources:
    limits:
      memory: 512Mi
    requests:
      memory: 512Mi
      cpu: 50m
  ingresses:
    - https://tilbakekreving-tvangsgrunnlag.intern.dev.nav.no
