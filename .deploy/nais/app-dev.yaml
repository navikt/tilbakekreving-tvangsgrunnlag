apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: "tilbakekreving-tvangsgrunnlag"
  namespace: "tilbake"
  labels:
    "team": "tilbake"

spec:
  image: {{image}}
  azure:
    application:
      enabled: true
  accessPolicy:
    outbound:
      rules:
        - application: tilbakekreving-backend
          namespace: teamfamilie
  env:
    - name: FAMILIE_TILBAKE_URL
      value: "http://tilbakekreving-backend.teamfamilie"
    - name: FAMILIE_TILBAKE_SCOPE
      value: "api://dev-gcp.teamfamilie.tilbakekreving-backend/.default"
  maskinporten:
    enabled: true
    scopes:
      exposes:
        - accessibleForAll: false
          allowedIntegrations:
            - maskinporten
          atMaxAge: 30
          consumers:
            - name: Skatteetaten
              orgno: "974761076"
            - name: NAV
              orgno: "889640782"
          enabled: true
          name: tvangsgrunnlag.read
          product: tilbakekreving
          separator: '/'
          visibility: private
      consumes:
        - name: "nav:tilbakekreving/tvangsgrunnlag.read"
  resources:
    limits:
      memory: 512Mi
    requests:
      memory: 512Mi
      cpu: 50m
  ingresses:
    - https://tilbakekreving-tvangsgrunnlag.intern.dev.nav.no
    - https://tilbakekreving-tvangsgrunnlag.ekstern.dev.nav.no/api/tilbakekreving/tvangsgrunnlag/v1
