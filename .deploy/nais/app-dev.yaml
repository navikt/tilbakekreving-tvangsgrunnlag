apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: "tilbakekreving-tvangsgrunnlag"
  namespace: "tilbake"
  labels:
    "team": "tilbake"

spec:
  image: {{image}}
  maskinporten:
    enabled: true
    scopes:
      exposes:
        - accessibleForAll: false
          allowedIntegrations:
            - maskinporten
          atMaxAge: 30
          consumers:
            - name: Skatteetaten
              orgno: "974761076"
            - name: NAV
              orgno: "889640782"
          enabled: true
          name: tvangsgrunnlag.read
          product: tilbakekreving
          separator: '/'
          visibility: private
      consumes:
        - name: "nav:tilbakekreving/tvangsgrunnlag.read"
  ingresses:
    - https://tilbakekreving-tvangsgrunnlag.intern.dev.nav.no
    - https://tilbakekreving-tvangsgrunnlag.ekstern.dev.nav.no/api/tilbakekreving/tvangsgrunnlag/v1
