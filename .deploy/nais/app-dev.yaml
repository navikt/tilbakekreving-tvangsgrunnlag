apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: "tilbakekreving-tvangsgrunnlag"
  namespace: "tilbake"
  annotations:
    nais.io/run-as-group: "65532" # nonroot https://github.com/GoogleContainerTools/distroless/issues/443
    nais.io/run-as-user: "65532" # nonroot https://github.com/GoogleContainerTools/distroless/issues/443
  labels:
    "team": "tilbake"

spec:
  maskinporten:
    enabled: true
    scopes:
      exposes:
        - accessibleForAll: false
          allowedIntegrations:
            - maskinporten
          atMaxAge: 30
          consumers:
            - name: Skatteetaten
              orgno: "974761076"
          delegationSource: altinn
          enabled: true
          name: scope.read
          product: arbeid
          separator: '/'
          visibility: private