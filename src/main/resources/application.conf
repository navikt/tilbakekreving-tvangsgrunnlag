ktor {
    deployment {
        port = 8080
    }
    application {
        modules = [ no.nav.tilbakekreving.tvangsgrunnlag.ApplicationKt.module ]
    }
}

familieTilbake {
    baseUrl = ${?FAMILIE_TILBAKE_URL}
    scope = ${?FAMILIE_TILBAKE_SCOPE}
    tokenEndpoint = ${?NAIS_TOKEN_ENDPOINT}
}

no.nav.security.jwt.issuers = [
    {
        issuer_name = "maskinporten"
        discoveryurl = ${MASKINPORTEN_WELL_KNOWN_URL}
        validation.optional_claims = "aud,sub"
    }
]
